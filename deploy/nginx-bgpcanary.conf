server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __FQDN__;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }   # Let's Encrypt (see docs/INSTALL.md)
    location / { return 301 https://$host$request_uri; }
}

server {
    # the installer fills in the HTTP/2 syntax the installed nginx understands
    listen 443 ssl__H2_LISTEN__ default_server;
    listen [::]:443 ssl__H2_LISTEN__ default_server;
    __H2_ON__
    server_name __FQDN__;

    ssl_certificate     /etc/pki/tls/certs/bgpcanary.crt;
    ssl_certificate_key /etc/pki/tls/private/bgpcanary.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
