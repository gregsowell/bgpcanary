# Password guessing is limited by the app too; this stops floods of login POSTs before they reach it.
map $request_method $bgpcanary_login_key { POST $binary_remote_addr; default ""; }
limit_req_zone $bgpcanary_login_key zone=bgpcanary_login:1m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __FQDN__;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /usr/share/nginx/html; }   # Let's Encrypt (see docs/INSTALL.md)
    location / { return 301 https://$host$request_uri; }
}

server {
    # the installer fills in the HTTP/2 syntax the installed nginx understands
    listen 443 ssl__H2_LISTEN__ default_server;
    listen [::]:443 ssl__H2_LISTEN__ default_server;
    __H2_ON__
    server_name __FQDN__;

    ssl_certificate     /etc/pki/tls/certs/bgpcanary.crt;
    ssl_certificate_key /etc/pki/tls/private/bgpcanary.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # everything the pages use is served from here: scripts, data and frames can only come from (and go to) this site.
    # Inline scripts stay allowed because the pages use them, so this limits what injected script could reach rather
    # than stopping it from running.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location = /login {
        limit_req zone=bgpcanary_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;   # as the browser sent it, port included (the app checks POSTs come from its own origin)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
