name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7
        with:
          python-version: "3.11"   # the oldest Python bgpcanary supports (it needs tomllib)
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compiles and imports
        run: |
          python -m compileall -q bgpcanary
          python -c "import bgpcanary.config, bgpcanary.db, bgpcanary.engine, bgpcanary.paths, bgpcanary.updates"
      - name: Templates compile
        run: |
          python - <<'EOF'
          import glob, jinja2, os
          env = jinja2.Environment(loader=jinja2.FileSystemLoader("bgpcanary/templates"))
          env.filters.update(dur=lambda x: x, fromjson=lambda x: x, mask_urls=lambda x: x)
          for t in sorted(glob.glob("bgpcanary/templates/*.html")):
              env.get_template(os.path.basename(t))
          print("templates ok")
          EOF
      - name: Shell scripts parse
        run: for f in deploy/*.sh; do bash -n "$f"; done
      - name: Version is valid
        run: grep -Eq '^__version__ = "[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?"$' bgpcanary/__init__.py
