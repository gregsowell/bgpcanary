# When a version tag (vX.Y.Z) is pushed: build and test the container image for amd64 and arm64, publish it to
# ghcr.io, then publish the GitHub release (which bgpcanary-update installs from). See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - name: Tag matches __version__
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' bgpcanary/__init__.py)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = $V in bgpcanary/__init__.py"; exit 1
          fi
      - name: CHANGELOG.md has a section for it
        run: |
          V="${GITHUB_REF_NAME#v}"
          if ! awk -v h="## [$V]" 'index($0, h) == 1 {found=1} END {exit !found}' CHANGELOG.md; then
            echo "::error::No '## [$V]' section in CHANGELOG.md"; exit 1
          fi

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io
      id-token: write        # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1   # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069   # v4.4.1
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: bgpcanary:test-amd64
      - name: Test on amd64
        run: bash deploy/docker/smoke-test.sh bgpcanary:test-amd64 linux/amd64
      - name: Build for arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: bgpcanary:test-arm64
      - name: Test on arm64 (emulated, so slower)
        run: WAIT=600 bash deploy/docker/smoke-test.sh bgpcanary:test-arm64 linux/arm64
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302   # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # X.Y.Z, X.Y, X and latest; a pre-release (vX.Y.Z-rc1) gets only its own tag
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=bgpcanary
            org.opencontainers.image.licenses=FSL-1.1-ALv2
          annotations: |
            org.opencontainers.image.title=bgpcanary
            org.opencontainers.image.licenses=FSL-1.1-ALv2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f   # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc   # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Attest where the image came from (signed SLSA build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6   # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false   # (only possible for organization-owned repositories)

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v h="## [$V]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::No '## [$V]' section in CHANGELOG.md"; exit 1; fi
          printf '\n---\nUpdate a server install with `sudo bgpcanary-update`. Container image: `ghcr.io/%s:%s` (with Docker Compose: `docker compose pull && docker compose up -d`).\nNew installs: [docs/INSTALL.md](https://github.com/%s/blob/%s/docs/INSTALL.md) for a server, [docs/DOCKER.md](https://github.com/%s/blob/%s/docs/DOCKER.md) for a container.\n' \
            "${GITHUB_REPOSITORY,,}" "$V" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "bgpcanary ${GITHUB_REF_NAME#v}" --notes-file notes.md $PRE
