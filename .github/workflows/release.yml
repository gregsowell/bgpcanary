# Publishes a GitHub release when a version tag (vX.Y.Z) is pushed. See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches __version__
        run: |
          V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' bgpcanary/__init__.py)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = $V in bgpcanary/__init__.py"; exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v h="## [$V]" 'index($0, h) == 1 {on=1; next} on && index($0, "## [") == 1 {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::No '## [$V]' section in CHANGELOG.md"; exit 1; fi
          printf '\n---\nUpdate an existing install with `sudo bgpcanary-update`. New installs: see [docs/INSTALL.md](https://github.com/%s/blob/%s/docs/INSTALL.md).\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""; case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --title "bgpcanary ${GITHUB_REF_NAME#v}" --notes-file notes.md $PRE
